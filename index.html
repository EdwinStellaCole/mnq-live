<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNQZ26 Live P&amp;L</title>
<style>
  :root { --bg:#141413; --panel:#1d1d1b; --line:#33332f; --fg:#f5f4ee; --muted:#9a9a92; --ok:#5fb97a; --bad:#e0655b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; justify-content:center; padding:24px; }
  .card { width:min(560px,100%); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; }
  .head { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--muted); gap:12px; flex-wrap:wrap; }
  .live { display:inline-flex; align-items:center; gap:8px; }
  .dot { position:relative; width:10px; height:10px; border-radius:50%; background:#fff; }
  .dot::after { content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid #fff; animation:pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { transform:scale(.7); opacity:.9; } 100% { transform:scale(1.9); opacity:0; } }
  .label { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-top:20px; }
  .big { font-size:56px; font-family:Georgia,"Times New Roman",serif; font-variant-numeric:tabular-nums; margin:6px 0 4px; line-height:1.1; }
  .sub { font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .px { color:#fff; font-weight:600; animation:blink 1.8s ease-out infinite; }
  @keyframes blink { 0% { opacity:1; } 100% { opacity:.35; } }
  @media (prefers-reduced-motion:reduce) { .dot::after, .px { animation:none; } }
  .row { display:flex; gap:24px; margin-top:20px; border-top:1px solid var(--line); padding-top:16px; flex-wrap:wrap; }
  .row div { min-width:120px; }
  .row b { display:block; font-size:20px; font-weight:500; font-variant-numeric:tabular-nums; margin-top:4px; }
  .err { color:var(--bad); font-size:13px; margin-top:14px; }
</style>
</head>
<body>
<main class="card">
  <div class="head">
    <span>Long 1 MNQZ26 · entry <span id="entry">—</span></span>
    <span class="live"><span class="dot"></span><span id="status">Live</span></span>
  </div>

  <div class="label">Live P&amp;L <span id="dayLabel"></span></div>
  <div class="big" id="pnl">—</div>
  <div class="sub"><span class="px" id="last">—</span> last · <span id="pts">—</span> from entry</div>

  <div class="row">
    <div><span class="label" style="margin:0">At last settle</span><b id="settlePnl">—</b></div>
    <div><span class="label" style="margin:0">Settle price</span><b id="settle">—</b></div>
    <div><span class="label" style="margin:0">Quote time</span><b id="qtime" style="font-size:16px">—</b></div>
  </div>
  <div class="err" id="err" hidden></div>
</main>

<script>
  // ---- Settings: update SETTLE when the daily settlement changes ----
  const GIST_RAW = "https://gist.githubusercontent.com/EdwinStellaCole/19be567d833442393aaf28c85b8b71a3/raw/mnq_live.csv";
  const ENTRY = 29070;
  const POINT_VALUE = 2;      // MNQ: $2 per index point
  const QTY = 1;
  const SETTLE = 28305.75;    // last settlement price (CME)
  const SETTLE_PNL = (SETTLE - ENTRY) * QTY * POINT_VALUE;
  const POLL_MS = 5000;

  const num = v => v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const usd = v => (v < 0 ? "-$" : "+$") + num(Math.abs(v));
  const tone = v => (v < 0 ? "var(--bad)" : "var(--ok)");
  const set = (id, text, color) => {
    const el = document.getElementById(id);
    el.textContent = text;
    if (color) el.style.color = color;
  };

  function render(last, time) {
    const pts = last - ENTRY;
    const pnl = pts * QTY * POINT_VALUE;
    const day = (last - SETTLE) * QTY * POINT_VALUE;
    set("entry", num(ENTRY));
    set("pnl", usd(pnl), tone(pnl));
    set("dayLabel", "· Day " + usd(day), tone(day));
    set("last", num(last));
    set("pts", (pts < 0 ? "-" : "+") + num(Math.abs(pts)) + " pts");
    set("settlePnl", usd(SETTLE_PNL), tone(SETTLE_PNL));
    set("settle", num(SETTLE));
    set("qtime", time || "—");
    set("status", pnl >= 0 ? "In profit" : "Underwater");
  }

  async function poll() {
    const err = document.getElementById("err");
    try {
      const res = await fetch(GIST_RAW + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const lines = (await res.text()).trim().split(/\r?\n/);
      const cols = lines[lines.length - 1].split(",");
      const last = Number(cols[1]);
      if (!isFinite(last)) throw new Error("price not readable");
      render(last, cols[2]);
      err.hidden = true;
    } catch (e) {
      err.hidden = false;
      err.textContent = "No update: " + e.message + " (retrying)";
    }
    setTimeout(poll, POLL_MS);
  }

  poll();
</script>
</body>
</html>
